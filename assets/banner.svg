<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>

    <linearGradient id="primaryText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.02" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 56px;
        letter-spacing: -1px;
      }
      .subtitle {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 22px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #e2e8f0;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .pulse-circle2 {
        animation: pulse2 5s ease-in-out infinite alternate;
      }
      .float-pill {
        animation: float 6s ease-in-out infinite alternate;
      }
      .float-pill-reverse {
        animation: floatReverse 7s ease-in-out infinite alternate;
      }
      .grid-line {
        stroke: #38bdf8;
        stroke-opacity: 0.07;
        stroke-width: 1;
      }
      @keyframes pulse {
        0% { transform: scale(0.9) translate(0px, 0px); opacity: 0.35; }
        100% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
      }
      @keyframes pulse2 {
        0% { transform: scale(1.1) translate(0px, 0px); opacity: 0.4; }
        100% { transform: scale(0.85) translate(-25px, 20px); opacity: 0.7; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes floatReverse {
        0% { transform: translateY(0px); }
        100% { transform: translateY(12px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Background Animated Glowing Orbs -->
  <circle cx="200" cy="100" r="140" fill="#38bdf8" filter="url(#glow)" class="pulse-circle" />
  <circle cx="1020" cy="280" r="160" fill="#a855f7" filter="url(#glow)" class="pulse-circle2" />
  <circle cx="600" cy="380" r="120" fill="#4f46e5" filter="url(#glow)" opacity="0.3" />

  <!-- Subtle Digital Tech Grid in background -->
  <g>
    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="320" x2="1200" y2="320" class="grid-line" />
    
    <line x1="200" y1="0" x2="200" y2="400" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="400" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="400" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="400" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="400" class="grid-line" />
  </g>

  <!-- Side Floating Feature Badges (Dynamic Floating Layer) -->
  <g class="float-pill">
    <rect x="80" y="55" width="165" height="42" rx="21" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="102" cy="76" r="6" fill="#38bdf8" />
    <text x="118" y="81" class="pill-text">100% Remote AI</text>
  </g>

  <g class="float-pill-reverse">
    <rect x="960" y="65" width="170" height="42" rx="21" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="982" cy="86" r="6" fill="#a855f7" />
    <text x="998" y="91" class="pill-text">LLMs &amp; GenAI Jobs</text>
  </g>

  <g class="float-pill">
    <rect x="940" y="300" width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="962" cy="321" r="6" fill="#818cf8" />
    <text x="978" y="326" class="pill-text">Global Compensation</text>
  </g>

  <g class="float-pill-reverse">
    <rect x="80" y="300" width="165" height="42" rx="21" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="102" cy="321" r="6" fill="#34d399" />
    <text x="118" y="326" class="pill-text">Curated &amp; Vetted</text>
  </g>

  <!-- Foreground Title Card / Content - Clear & In Foreground -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Center Icon / Badge -->
    <rect x="-45" y="-105" width="90" height="34" rx="17" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="-83" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#38bdf8" letter-spacing="1.5">GLOBAL TALENT</text>

    <!-- Main Title -->
    <text x="0" y="-20" class="title" fill="url(#primaryText)">Awesome Remote AI Jobs 🤖</text>
    
    <!-- Subtitle -->
    <text x="0" y="25" class="subtitle">The definitive directory of remote AI, ML, Data Science, and LLM roles</text>

    <!-- Secondary Tagline with Highlights -->
    <text x="0" y="65" font-family="system-ui, sans-serif" font-size="15" fill="#64748b" font-weight="500">
      🚀 Top AI Labs  •  💼 Verified Job Boards  •  💰 Real Salaries  •  🤝 Active Communities
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="350" y="375" width="500" height="3" rx="1.5" fill="url(#primaryText)" opacity="0.8" />
</svg>